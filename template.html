<!DOCTYPE html>
<html lang="en">

<!--
    This is the page layout. The words in {{double braces}} are filled in by build.py
    from the files in content/. To change text, edit content/*.md, not this file.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{name}}</title>
    <meta name="description"
        content="{{name}}, Senior Research Assistant at SUTD. Computer vision and machine learning for real-world robot perception.">
    <meta name="author" content="{{name}}">

    <!-- Social previews (LinkedIn, Twitter, Slack, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{name}}">
    <meta property="og:description"
        content="Computer vision and machine learning researcher building perception systems for real robots.">
    <meta property="og:image" content="https://shruti-bt.github.io/{{photo}}">
    <meta name="twitter:card" content="summary">

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239C4E24'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23F7F3EA' text-anchor='middle'%3ESB%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">

        <nav>
            <a href="#" class="nav-brand">{{name_nobreak}}</a>
            <div class="nav-links">
                <a href="#news" class="nav-item">News</a>
                <a href="#publications" class="nav-item">Publications</a>
            </div>
        </nav>

        <header>
            <div class="profile-row">
                <div class="profile-info">
                    <h1>{{name_nobreak}}</h1>
                    <p class="role-line">{{role}}</p>
                </div>
                <img src="{{photo}}" alt="Portrait of {{name}}" class="profile-photo">
            </div>

            <div class="profile-bio">
{{about}}
            </div>

            <ul class="header-links">
{{links}}
            </ul>
        </header>

        <section id="news">
            <h2>News &amp; Highlights</h2>
            <div class="news-scroll" tabindex="0" aria-label="News and highlights, scrollable">
                <ul class="news-list">
{{news}}
                </ul>
            </div>
        </section>

        <section id="publications">
            <h2>Publications</h2>
{{publications}}
        </section>

        <footer>
            &copy; <strong>{{year}}</strong> {{name}}. All rights reserved.
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
