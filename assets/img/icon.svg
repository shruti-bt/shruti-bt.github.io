<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- tab icon: a hand-drawn cherry blossom. Five lopsided pink petals with a soft rose
       outline, a shallow dip at each tip and faint veins, fading from deeper pink at the
       centre; two shine marks; ten stamens with gold tips round a deep rose eye. -->
  <defs>
    <!-- petals deeper pink by the centre, fading to pale at the tips -->
    <radialGradient id="petal-fill" gradientUnits="userSpaceOnUse" cx="32" cy="32" r="28">
      <stop offset="0.2" stop-color="#F4A9A6"/>
      <stop offset="1" stop-color="#FCE3DC"/>
    </radialGradient>
    <!-- one petal: straight sides out from the centre (a fifth of the circle), then a round
         lobe with a shallow dip at the tip, so neighbours share a line and leave a deep dip -->
    <g id="petal">
      <path
          d="M32 32 C29.4 28.6 26.8 25.4 24.95 22.3 C21.4 19.6 18.6 15.9 19 11.5 C19.5 6.9 23.6 3.7 28.2 4 C30.1 4.1 31.6 5 32.5 6.3 C33.2 5.4 34.4 4.8 36 4.8 C40.4 4.8 44.2 7.6 44.7 11.8 C45.1 15.9 42.6 19.6 39.05 22.3 C36.8 25.6 34.4 28.8 32 32 Z"
            fill="url(#petal-fill)" stroke="#C8655C" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- faint veins from the base towards the tip -->
      <path d="M32 26 C32.2 20 32.3 14 32.4 9.5 M30.6 24 C28.6 19.5 26.4 15.5 24.2 12.2 M33.6 24 C35.6 19.6 37.8 15.8 40 12.6"
            fill="none" stroke="#E08C88" stroke-opacity="0.45" stroke-width="0.6" stroke-linecap="round"/>
    </g>
    <!-- two short shine marks near the edge of a petal -->
    <path id="shine" d="M39.4 7.6 C41.3 8.5 42.6 10.2 42.9 12.3 M37.9 9.6 C39.2 10.3 40 11.4 40.2 12.6"
          fill="none" stroke="#C8655C" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round"/>
    <!-- one stamen: a thin dark red line ending in a small gold tip -->
    <g id="stamen">
      <path d="M32 32 V21.8" stroke="#A84452" stroke-width="0.75" stroke-linecap="round"/>
      <circle cx="32" cy="21" r="1.3" fill="#F2B33D" stroke="#A84452" stroke-width="0.5"/>
    </g>
  </defs>

  <!-- five petals round the centre, each a touch different in size and angle so it
       looks drawn by hand, and the whole flower tilted a little -->
  <g transform="rotate(-8 32 32)">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(71 32 32) translate(32 32) scale(0.96) translate(-32 -32)"/>
    <use href="#petal" transform="rotate(145 32 32) translate(32 32) scale(1.02) translate(-32 -32)"/>
    <use href="#petal" transform="rotate(215 32 32) translate(32 32) scale(0.97) translate(-32 -32)"/>
    <use href="#petal" transform="rotate(289 32 32) translate(32 32) scale(1.01) translate(-32 -32)"/>
    <!-- shine on the upper right and lower left petals -->
    <use href="#shine" transform="rotate(71 32 32) translate(32 32) scale(0.96) translate(-32 -32)"/>
    <use href="#shine" transform="rotate(215 32 32) translate(32 32) scale(0.97) translate(-32 -32)"/>
  </g>


  <!-- soft pink blush round the centre -->
  <circle cx="32" cy="32" r="6.5" fill="#F4B2A8"/>

  <!-- ten stamens: five long, five a little shorter in between -->
  <use href="#stamen" transform="rotate(18 32 32)"/>
  <use href="#stamen" transform="rotate(90 32 32)"/>
  <use href="#stamen" transform="rotate(162 32 32)"/>
  <use href="#stamen" transform="rotate(234 32 32)"/>
  <use href="#stamen" transform="rotate(306 32 32)"/>
  <g transform="translate(32 32) scale(0.8) translate(-32 -32)">
    <use href="#stamen" transform="rotate(54 32 32)"/>
    <use href="#stamen" transform="rotate(126 32 32)"/>
    <use href="#stamen" transform="rotate(198 32 32)"/>
    <use href="#stamen" transform="rotate(270 32 32)"/>
    <use href="#stamen" transform="rotate(342 32 32)"/>
  </g>

  <!-- small deep rose eye -->
  <circle cx="32" cy="32" r="2.6" fill="#C94A5E"/>
</svg>
